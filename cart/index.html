<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 13 — Shopping Cart</title>
  <link rel="stylesheet" href="cart.css">
  <script type="module" src="cart.js"></script>
</head>
<body>
  <main class="cart-wrap">
    <p class="eyebrow">IYF SEASON 12 · LESSON 13</p>
    <h1>Mini Shop</h1>
    <p class="subheading">Add a few essentials to your basket.</p>
    <section id="products" class="products" aria-label="Products"></section>
    <section class="basket">
      <div class="basket-heading"><h2>Your basket</h2><span id="item-count">0 items</span></div>
      <ul id="cart-items"></ul>
      <div class="total-row"><span>Total</span><strong id="cart-total">KSh 0</strong></div>
      <button id="checkout" type="button">Checkout demo</button>
      <p id="cart-message" role="status"></p>
    </section>
  </main>
</body>
</html>
