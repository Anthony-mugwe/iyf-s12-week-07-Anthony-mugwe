<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Interactive to-do list built with the DOM." />
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1>My To-Do List</h1>
        <p>Organize your tasks, one step at a time.</p>
      </div>
    </header>
    <main class="container">
      <section class="todo-card" aria-labelledby="todo-heading">
        <h2 id="todo-heading">Today's Tasks</h2>
        <form id="task-form">
          <label for="task-input">Add a new task</label>
          <div class="task-entry">
            <input
              id="task-input"
              type="text"
              maxlength="200"
              placeholder="What needs to be done?"
              autocomplete="off"
              required
            /><button type="submit">Add Task</button>
          </div>
          <p id="form-message" class="form-message" aria-live="polite"></p>
        </form>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button type="button" class="filter-button active" data-filter="all" aria-pressed="true">
            All
          </button>
          <button type="button" class="filter-button" data-filter="active" aria-pressed="false">
            Active
          </button>
          <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">
            Completed
          </button>
        </div>
        <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
        <p id="empty-message" class="empty-message">No tasks yet. Add your first task above!</p>
        <p id="task-count" aria-live="polite">0 tasks</p>
        <footer class="todo-footer">
          <p id="items-left" aria-live="polite">0 items left</p>
          <p id="items-left" aria-live="polite">0 items left</p>
          <button type="button" id="clear-completed" class="clear-button">Clear Completed</button>
        </footer>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container"><p>Built with HTML, CSS, and JavaScript.</p></div>
    </footer>
  </body>
</html>
